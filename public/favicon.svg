<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Leika Studio. Logotypens klamrar i accentfärg kring ett serif-l.
       Ritat som paths, inte som textelement: en favicon kan inte ladda
       Playfair Display, så text hade renderats i valfri systemfont.
       Alla mått är multiplar av 4, så kanterna faller på pixelrutnätet
       vid 16 px (4 enheter/px) och 32 px (2 enheter/px). -->
  <rect width="64" height="64" fill="#EDEDED"/>
  <g fill="#B24A28">
    <path d="M4 8 H20 V16 H12 V48 H20 V56 H4 Z"/>
    <path d="M60 8 H44 V16 H52 V48 H44 V56 H60 Z"/>
  </g>
  <g fill="#101010">
    <rect x="28" y="12" width="8" height="36"/>
    <rect x="24" y="48" width="16" height="8"/>
  </g>
</svg>
